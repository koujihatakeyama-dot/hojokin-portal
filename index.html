const JUNK_TITLE=/^(結果|詳細|一覧|こちら|ここ|ＰＤＦ|PDF|様式|要領|公募要領|公募結果|採択結果|応募結果|結果はこちら|詳しくはこちら)/;
function isJunk(d){
  const t=String((d&&d.title)||"").replace(/[\s　]/g,"");
  if(!t)return true;
  if(JUNK_TITLE.test(t))return true;
  if(d.pending&&t.length<8)return true;
  return false;
}

let DATA=SAMPLE.slice(),custom=false,UPDATED="",loadFailed=false;
async function loadData(){try{const r=await fetch("data.json",{cache:"no-store"});if(!r.ok)throw new Error("http");const j=await r.json();if(j&&Array.isArray(j.items)){DATA=j.items;UPDATED=j.updated_at||j.updated||"";}else{loadFailed=true;}}catch(e){loadFailed=true;}DATA=DATA.filter(d=>!isJunk(d));}

function parsePeriod(p){
  const m=String(p||"").match(/(\d{4})-(\d{1,2})-(\d{1,2})\s*[～〜~\-]\s*(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m)return null;
  const z=n=>String(n).padStart(2,"0");
  return [m[1]+"-"+z(m[2])+"-"+z(m[3]),m[4]+"-"+z(m[5])+"-"+z(m[6])];
}
function today(){const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")}
function status(p){
  const r=parsePeriod(p);
  if(!r)return "unk";
  const t=today();
  return t<r[0]?"soon":(t>r[1]?"end":"open");
}
function daysLeft(p){
  const r=parsePeriod(p);if(!r)return null;
  return Math.round((new Date(r[1]+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000);
}
function leftText(p){
  const r=parsePeriod(p);if(!r)return "";
  const t=new Date(today()+"T00:00:00"),day=86400000;
  const a=Math.round((new Date(r[0]+"T00:00:00")-t)/day),b=Math.round((new Date(r[1]+"T00:00:00")-t)/day);
  if(a>0)return "開始まで あと"+a+"日";
  if(b>0)return "締切まで あと"+b+"日";
  if(b===0)return "本日が締切";
  return "締切から"+(-b)+"日経過";
}
function fmtPeriod(p){
  const r=parsePeriod(p);if(!r)return p||NA;
  const a=r[0].split("-").map(Number),b=r[1].split("-").map(Number);
  return a[0]===b[0]?`${a[0]}年${a[1]}月${a[2]}日〜${b[1]}月${b[2]}日`:`${a[0]}年${a[1]}月${a[2]}日〜${b[0]}年${b[1]}月${b[2]}日`;
}

  const o=String(d.organization||"").trim();if(!o)return "";
  if(d.source==="jgrants"){ // 公式データの「機関名」欄に事業名が入っているものは、主管として出さない
    const cl=x=>String(x).replace(/【[^】]*】/g,"").replace(/令和\s*[0-9０-９]+\s*年度/g,"").replace(/\s/g,"");
    const a=cl(o),b=cl(d.title||"");
    if(a&&b&&(b.includes(a.slice(0,6))||a.includes(b.slice(0,6))))return "";
  }
  return o;
}
function orgName(d){return orgText(d).split("（")[0].trim()}
function simplifyWho(w){
  const m=String(w||"").match(/業種：([^／]*)/);if(!m)return w;
  const list=m[1].split("/").map(x=>x.trim()).filter(Boolean);
  if(list.length<8)return w;
  const rest=String(w).replace(/業種：[^／]*／?\s*/,"").trim();
  return (list.includes("農業")?"業種の制限は広く、農業も対象に含まれる":"業種の制限は広い")+(rest?"／"+rest:"");
}
function orgBadge(d){const n=orgName(d);if(!n)return d.source==="jgrants"?'<span class="src">出典：Jグランツ（デジタル庁）</span>':"";const c=/農林水産/.test(n)?"maff":/環境/.test(n)?"env":/経済産業|中小企業庁/.test(n)?"meti":(d.source==="jgrants"?"jg":"");return `<span class="orgb ${c}">${esc(n)}</span>`+(d.source==="jgrants"?'<span class="src">出典：Jグランツ（デジタル庁）</span>':"")}
// 掲載日時（日本時間）。農水省の公告日をもとにした項目（時刻が 00:00）は、時刻を出さず日付だけにする
function addedText(d){
  const t=Date.parse(d.added_at||"");if(!t)return "";
  const jp=new Date(t+9*3600000),z=n=>String(n).padStart(2,"0");
  const day=jp.getUTCFullYear()+"-"+z(jp.getUTCMonth()+1)+"-"+z(jp.getUTCDate());
  if(jp.getUTCHours()===0&&jp.getUTCMinutes()===0)return "公告日："+day;
  return "掲載日時（日本時間）："+day+" "+z(jp.getUTCHours())+":"+z(jp.getUTCMinutes());
}
const stLabel=k=>STS.find(s=>s[0]===k)[1];

function init(){
  $("pref").innerHTML='<option value="">すべて</option>'+PREFS.map(p=>`<option>${p}</option>`).join("");
  $("cat").innerHTML='<option value="">すべて</option>'+CATS.map(c=>`<option>${c}</option>`).join("");
  $("stats").innerHTML=STS.map(s=>`<label><input type="checkbox" value="${s[0]}" class="sc"${s[0]!=="end"?" checked":""}><span>${s[1]}</span></label>`).join("");
  ["pref","cat","kw"].forEach(i=>$(i).addEventListener("input",render));
  document.querySelectorAll(".sc").forEach(e=>e.addEventListener("change",render));
  render();
}

function render(){
  const pref=$("pref").value,cat=$("cat").value,kw=$("kw").value.trim().toLowerCase();
  const ss=[...document.querySelectorAll(".sc:checked")].map(e=>e.value);
  const hit=DATA.filter(d=>{
    // 地域：全国の事業は、どの都道府県で絞っても残す
    if(pref&&d.prefecture!=="全国"&&!String(d.prefecture||"").includes(pref))return false;
    if(cat&&d.category!==cat&&!(CATS.includes(cat)&&String(d.category||"").includes(cat.slice(0,4))&&false))return false;
    if(ss.length&&!ss.includes(status(d.application_period)))return false;
    if(kw&&![d.title,d.organization,d.summary,d.category].join(" ").toLowerCase().includes(kw))return false;
    return true;
  });
  const newKey=d=>d.added_at||(parsePeriod(d.application_period)||[""])[0];
  hit.sort((a,b)=>{const x=newKey(a),y=newKey(b);return x<y?1:(x>y?-1:0)});
  $("count").textContent=hit.length+" 件";
  $("list").innerHTML=hit.length?hit.map(card).join(""):'<p class="none">条件に合う情報がありません。条件を緩めてみてください。</p>';
  $("notice").innerHTML=(loadFailed?"<b>⚠ 最新のデータを読み込めなかったため、保存されている古い情報（2026-10-04時点）を表示しています。時間をおいて、ページを再読み込みしてください。</b><br>":"")+(custom?"読み込んだデータを表示しています。内容は必ず公式ページでご確認ください。":"農林水産省の公募一覧"+(DATA.some(d=>d.source==="jgrants")?"と、デジタル庁「Jグランツ」の公開情報":"")+"、および人が公式ページで確認した公募を、対象・募集期間・応募方法がひと目で分かるようにまとめています。募集期間や受付状況は変わることがあるため、申請の前に、必ず公式ページで最新の状況をご確認ください。"+(DATA.some(d=>d.pending)?"「自動取得」の札が付いた項目（"+DATA.filter(d=>d.pending).length+"件）は、公式ページの一覧から機械的に取り込んだもので、対象・目的・応募方法などの説明はまだありません。詳しくは公式ページをご覧ください。":"")+(UPDATED?"（最新更新日時（日本時間）："+esc(UPDATED)+"）":"")+" 初期表示では、終了した公募は隠れています。見るには「募集状況」の「終了」にチェックを入れてください。");
}

function card(d){
  const k=status(d.application_period),u=safeUrl(d.official_url),n=daysLeft(d.application_period);
  const lt=leftText(d.application_period),left=(k!=="unk"&&lt)?`<span class="left">${esc(lt)}</span>`:"";
  const roles="";
  const wS=AI(d).who_short||simplifyWho(F(d,'who'));
  const who=wS?`<div class="info"><b>対象</b>${esc(wS)}${(!d.who&&(AI(d).who_short||AI(d).who))?AIB:''}</div>`:'<div class="info"><b>対象</b><span class="none">公式ページでご確認ください（要約を準備中）</span></div>';
  return `<div class="card">
<div class="orgrow">${orgBadge(d)}</div>
<div>${isNew(d)?'<span class="newb">NEW</span>':""}<span class="st ${k}">${stLabel(k)}</span>${left}</div>
<h3>${esc(d.title||NA)}</h3>
<div class="meta">主管：${esc(orgText(d)||'公式ページでご確認ください')}／地域：${esc(d.prefecture||NA)}</div>
<div>${d.pending?'<span class="tag" style="background:var(--warn);color:var(--warnTx)">自動取得（詳細は公式ページで）</span>':""}${roles}</div>
${who}
<div class="info"><b>募集期間</b>${esc(fmtPeriod(d.application_period))}</div>
${addedText(d)?`<div class="meta">${esc(addedText(d))}</div>`:""}
${F(d,'purpose')?`<div class="info"><b>目的</b>${esc(F(d,'purpose'))}${fromAI(d,'purpose')?AIB:''}</div>`:""}
${MX(d)?`<div class="info"><b>補助上限額</b>${esc(MX(d))}</div>`:""}
${d.rate_text?`<div class="info"><b>補助率</b>${esc(d.rate_text)}</div>`:""}
${F(d,'how')?`<div class="info"><b>応募方法</b>${esc(F(d,'how'))}${fromAI(d,'how')?AIB:''}</div>`:""}
${(AI(d).amount&&!MX(d)&&!d.rate_text)?`<div class="info"><b>補助額・割合</b>${esc(AI(d).amount)}${AIB}</div>`:""}
${(AI(d).checks&&AI(d).checks.length)?`<div class="chk"><b>自社に当てはまるか、確認したい点</b>${AI(d).checks.map(c=>`<div>□ ${esc(c)}</div>`).join("")}</div>`:""}
${(AI(d).who||AI(d).purpose||AI(d).how||AI(d).amount||(AI(d).checks||[]).length)&&!(d.who&&d.purpose&&d.how)?'<div class="aiw">「AI要約」は公式ページの文章をやさしく言い直したものです。数字・日付は公式の文章と機械で照合していますが、申請の前に必ず公式ページで確認してください。</div>':""}
<div class="btns">
<button class="btn o" onclick="openD('${esc(d.id)}')">申請ガイド</button>
${u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">公式ページ（1次情報）</a>`:'<span class="none">1次情報URL：'+NA+'</span>'}
</div></div>`;
}

function openD(id){
  const d=DATA.find(x=>String(x.id)===id);if(!d)return;
  const u=safeUrl(d.official_url);
  const btn=u?`<a class="btn big" href="${esc(u)}" target="_blank" rel="noopener noreferrer">公式公募ページ（1次情報）を開く</a>`:'<p class="none">公式URL：詳細は公式ページをご確認ください</p>';
  const k=status(d.application_period);
  $("md").innerHTML=`<button class="btn o x" onclick="closeD()">閉じる</button>
${orgBadge(d)}<span class="st ${k}">${stLabel(k)}</span>
<h2>${esc(d.title||NA)}</h2>
<div class="meta">主管：${esc(orgText(d)||'公式ページでご確認ください')}／地域：${esc(d.prefecture||NA)}／カテゴリー：${esc(d.category||NA)}</div>
${d.dummy?'<div class="notice" style="margin-top:8px">これは表示確認用のダミーです。実在の補助金ではありません。</div>':""}
${btn}
<h4>事業概要</h4>
${F(d,'purpose')?`<p><b>目的：</b>${esc(F(d,'purpose'))}${fromAI(d,'purpose')?AIB:''}</p>`:""}
<p>${(d.overview||d.summary)?esc(d.overview||d.summary):NA+"（詳細は公式ページをご確認ください）"}</p>
<h4>対象</h4>
${F(d,'who')?`<p>${esc(F(d,'who'))}${fromAI(d,'who')?AIB:''}</p>`:""}
${(!F(d,'who'))?`<p class="none">${NA}（詳細は公式ページをご確認ください）</p>`:""}
<div class="meta">募集期間：${esc(fmtPeriod(d.application_period))}${leftText(d.application_period)?"（"+esc(leftText(d.application_period))+"）":""}</div>
${(MX(d)||d.rate_text)?`<h4>補助の内容（公式の記載）</h4><p>${MX(d)?"補助上限額："+esc(MX(d)):""}${MX(d)&&d.rate_text?"　／　":""}${d.rate_text?"補助率："+esc(d.rate_text):""}</p>`:""}
${F(d,'how')?`<h4>応募方法</h4><p>${esc(F(d,'how'))}${fromAI(d,'how')?AIB:''}</p>`:""}
${(AI(d).amount&&!MX(d)&&!d.rate_text)?`<h4>補助額・割合</h4><p>${esc(AI(d).amount)}${AIB}</p>`:""}
${(AI(d).checks&&AI(d).checks.length)?`<h4>自社に当てはまるか、確認したい点</h4><div class="chk">${AI(d).checks.map(c=>`<div>□ ${esc(c)}</div>`).join("")}</div>`:""}
${(AI(d).who||AI(d).purpose||AI(d).how||AI(d).amount||(AI(d).checks||[]).length)?'<p class="aiw">「AI要約」は公式ページの文章をやさしく言い直したものです。数字・日付は公式の文章と機械で照合していますが、申請の前に、必ず上の「公式公募ページ」で内容を確認してください。</p>':""}
<h4>公式ページ</h4>${btn}
${addedText(d)?`<div class="meta">${esc(addedText(d))}</div>`:""}
<div class="meta">最終更新：${esc(d.last_updated||NA)}</div>`;
  $("ov").classList.add("on");$("ov").scrollTop=0;
}
function closeD(){$("ov").classList.remove("on")}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeD()});

loadData().then(init);
</script>
</body>
</html>
